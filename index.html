<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام إدارة تجارة الملابس - إدخال منتجات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --blue-deep:#0B3D91;
    --blue-mid:#1E5FD9;
    --blue-soft:#EAF1FF;
    --ink:#0F1A2B;
    --muted:#5C6B85;
    --white:#FFFFFF;
    --line:#D7E2F5;
    --danger:#D9483A;
    --radius:14px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Cairo', sans-serif;
    background:linear-gradient(180deg, var(--blue-soft) 0%, #F7FAFF 100%);
    color:var(--ink);
    min-height:100vh;
    padding:32px 16px 80px;
  }
  .wrap{max-width:760px; margin:0 auto;}
  header{
    text-align:center;
    margin-bottom:28px;
  }
  header .badge{
    display:inline-block;
    background:var(--blue-deep);
    color:#fff;
    font-size:13px;
    font-weight:700;
    padding:6px 16px;
    border-radius:20px;
    margin-bottom:14px;
    letter-spacing:.3px;
  }
  header h1{
    font-size:26px;
    font-weight:800;
    color:var(--blue-deep);
  }
  header p{
    color:var(--muted);
    font-size:14px;
    margin-top:6px;
  }
  .card{
    background:var(--white);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:22px;
    margin-bottom:20px;
    box-shadow:0 4px 16px rgba(11,61,145,0.06);
  }
  .card-title{
    font-weight:700;
    font-size:16px;
    color:var(--blue-deep);
    margin-bottom:16px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .field{margin-bottom:14px;}
  .field label{
    display:block;
    font-size:13px;
    font-weight:600;
    color:var(--ink);
    margin-bottom:6px;
  }
  .field .req{color:var(--danger);}
  input[type=text], input[type=number], input[type=tel], select{
    width:100%;
    padding:11px 13px;
    border:1.5px solid var(--line);
    border-radius:10px;
    font-family:'Cairo', sans-serif;
    font-size:14px;
    background:#FBFCFE;
    transition:border-color .15s;
  }
  input:focus, select:focus{
    outline:none;
    border-color:var(--blue-mid);
    background:#fff;
  }
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .product-block{
    border:1.5px dashed var(--line);
    border-radius:12px;
    padding:18px;
    margin-bottom:16px;
    position:relative;
    background:#FCFDFF;
  }
  .product-block .p-num{
    position:absolute;
    top:-12px;
    right:16px;
    background:var(--blue-mid);
    color:#fff;
    font-size:12px;
    font-weight:700;
    padding:3px 12px;
    border-radius:20px;
  }
  .remove-btn{
    position:absolute;
    top:-12px;
    left:16px;
    background:var(--danger);
    color:#fff;
    border:none;
    font-size:12px;
    font-weight:700;
    padding:3px 12px;
    border-radius:20px;
    cursor:pointer;
  }
  .img-upload{
    border:1.5px solid var(--line);
    border-radius:10px;
    background:#FBFCFE;
    padding:14px;
    text-align:center;
    cursor:pointer;
    position:relative;
  }
  .img-upload input{
    position:absolute; inset:0; opacity:0; cursor:pointer;
  }
  .img-upload .hint{font-size:12px; color:var(--muted);}
  .img-preview{
    width:100%; max-height:150px; object-fit:contain;
    border-radius:8px; margin-top:10px; display:none;
  }
  .add-btn{
    width:100%;
    padding:13px;
    background:var(--blue-soft);
    border:1.5px dashed var(--blue-mid);
    color:var(--blue-deep);
    font-weight:700;
    font-size:14px;
    border-radius:10px;
    cursor:pointer;
    font-family:'Cairo', sans-serif;
    transition:background .15s;
  }
  .add-btn:hover{background:#DCE9FF;}
  .submit-btn{
    width:100%;
    padding:16px;
    background:var(--blue-deep);
    color:#fff;
    border:none;
    font-weight:800;
    font-size:16px;
    border-radius:12px;
    cursor:pointer;
    font-family:'Cairo', sans-serif;
    margin-top:8px;
    transition:background .15s;
  }
  .submit-btn:hover{background:#092E6E;}
  .submit-btn:disabled{background:#9FB3D6; cursor:not-allowed;}
  .status-msg{
    text-align:center;
    padding:14px;
    border-radius:10px;
    font-weight:600;
    font-size:14px;
    margin-top:14px;
    display:none;
  }
  .status-msg.ok{display:block; background:#E7F7EE; color:#1C7C42;}
  .status-msg.err{display:block; background:#FDEBEA; color:var(--danger);}
  @media(max-width:500px){
    .row2{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <span class="badge">🏬 نظام إدارة تجارة الملابس</span>
    <h1>إدخال بيانات منتجات جديدة</h1>
    <p>سجّل بياناتك مرة واحدة، وأضف كل موديلاتك في نفس الإرسال</p>
  </header>

  <form id="mainForm">

    <div class="card">
      <div class="card-title">👤 بيانات التاجر</div>
      <div class="row2">
        <div class="field">
          <label>اسم التاجر <span class="req">*</span></label>
          <input type="text" id="merchantName" required>
        </div>
        <div class="field">
          <label>رقم التليفون <span class="req">*</span></label>
          <input type="tel" id="merchantPhone" required placeholder="01xxxxxxxxx">
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">📦 المنتجات</div>
      <div id="productsContainer"></div>
      <button type="button" class="add-btn" id="addProductBtn">＋ إضافة منتج آخر</button>
    </div>

    <button type="submit" class="submit-btn" id="submitBtn">إرسال جميع المنتجات</button>
    <div class="status-msg" id="statusMsg"></div>
  </form>

</div>

<script>
// ⚠️ استبدل الرابط ده برابط الـ Webhook بتاعك من n8n
const WEBHOOK_URL = "https://overfeed-unwilling-contently.ngrok-free.dev/webhook/15d69624-e183-44fb-8c1e-6bdd9d8b940e";

let productCount = 0;
const container = document.getElementById('productsContainer');

function addProduct(){
  productCount++;
  const id = productCount;
  const block = document.createElement('div');
  block.className = 'product-block';
  block.dataset.id = id;
  block.innerHTML = `
    <span class="p-num">منتج ${id}</span>
    ${id > 1 ? `<button type="button" class="remove-btn" onclick="removeProduct(${id})">حذف ✕</button>` : ''}
    <div class="field">
      <label>اسم الموديل <span class="req">*</span></label>
      <input type="text" class="p-name" required>
    </div>
    <div class="row2">
      <div class="field">
        <label>السعر <span class="req">*</span></label>
        <input type="number" class="p-price" required min="0">
      </div>
      <div class="field">
        <label>الكمية المتاحة</label>
        <input type="number" class="p-stock" min="0" value="0">
      </div>
    </div>
    <div class="row2">
      <div class="field">
        <label>الألوان (مفصولة بفاصلة)</label>
        <input type="text" class="p-colors" placeholder="أحمر,أزرق,أسود">
      </div>
      <div class="field">
        <label>المقاسات (مفصولة بفاصلة)</label>
        <input type="text" class="p-sizes" placeholder="M,L,XL">
      </div>
    </div>
    <div class="field">
      <label>التصنيف</label>
      <select class="p-category">
        <option value="ملابس رجالي">ملابس رجالي</option>
        <option value="ملابس حريمي">ملابس حريمي</option>
        <option value="ملابس أطفال">ملابس أطفال</option>
        <option value="أحذية">أحذية</option>
        <option value="إكسسوارات">إكسسوارات</option>
      </select>
    </div>
    <div class="field">
      <label>صورة المنتج</label>
      <div class="img-upload">
        <span class="hint">اضغط لاختيار صورة (jpg/png)</span>
        <input type="file" class="p-image" accept=".jpg,.jpeg,.png">
        <img class="img-preview">
      </div>
    </div>
  `;
  container.appendChild(block);

  const fileInput = block.querySelector('.p-image');
  const preview = block.querySelector('.img-preview');
  fileInput.addEventListener('change', () => {
    const file = fileInput.files[0];
    if(file){
      const reader = new FileReader();
      reader.onload = e => {
        preview.src = e.target.result;
        preview.style.display = 'block';
      };
      reader.readAsDataURL(file);
    }
  });
}

function removeProduct(id){
  const block = container.querySelector(`[data-id="${id}"]`);
  if(block) block.remove();
}

function fileToBase64(file){
  return new Promise((resolve, reject) => {
    if(!file){ resolve(null); return; }
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

addProduct(); // منتج واحد افتراضي عند فتح الصفحة
document.getElementById('addProductBtn').addEventListener('click', addProduct);

document.getElementById('mainForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const submitBtn = document.getElementById('submitBtn');
  const statusMsg = document.getElementById('statusMsg');
  submitBtn.disabled = true;
  submitBtn.textContent = 'جاري الإرسال...';
  statusMsg.style.display = 'none';

  try{
    const blocks = [...container.querySelectorAll('.product-block')];
    const products = await Promise.all(blocks.map(async block => {
      const fileInput = block.querySelector('.p-image');
      const file = fileInput.files[0];
      const base64 = await fileToBase64(file);
      return {
        name: block.querySelector('.p-name').value,
        price: Number(block.querySelector('.p-price').value),
        stock: Number(block.querySelector('.p-stock').value) || 0,
        colors: block.querySelector('.p-colors').value.split(',').map(s=>s.trim()).filter(Boolean),
        sizes: block.querySelector('.p-sizes').value.split(',').map(s=>s.trim()).filter(Boolean),
        category: block.querySelector('.p-category').value,
        image_base64: base64,
        image_filename: file ? file.name : null
      };
    }));

    const payload = {
      merchant_name: document.getElementById('merchantName').value,
      merchant_phone: document.getElementById('merchantPhone').value,
      products
    };

    const res = await fetch(WEBHOOK_URL, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload)
    });

    if(!res.ok) throw new Error('فشل الإرسال');

    const data = await res.json();
    const results = data.results || [];

    if(results.length){
      const rejected = results.filter(r => r.status === 'rejected');
      const partial = results.filter(r => r.status === 'partial');
      const accepted = results.filter(r => r.status === 'success');

      let html = '';
      if(accepted.length){
        html += `<div>✅ تم إضافة ${accepted.length} منتج بالكامل</div>`;
      }
      if(partial.length){
        html += partial.map(r =>
          `<div style="margin-top:6px;">⚠️ "${r.product_name}": ${r.reason}</div>`
        ).join('');
      }
      if(rejected.length){
        html += rejected.map(r =>
          `<div style="margin-top:6px;">❌ "${r.product_name}": ${r.reason}</div>`
        ).join('');
      }
      statusMsg.innerHTML = html;
      statusMsg.className = (rejected.length || partial.length) ? 'status-msg err' : 'status-msg ok';
    } else {
      statusMsg.textContent = '✅ تم إرسال المنتجات بنجاح';
      statusMsg.className = 'status-msg ok';
    }

    document.getElementById('mainForm').reset();
    container.innerHTML = '';
    productCount = 0;
    addProduct();

  }catch(err){
    statusMsg.textContent = '❌ حصل خطأ أثناء الإرسال، حاول تاني';
    statusMsg.className = 'status-msg err';
  }finally{
    submitBtn.disabled = false;
    submitBtn.textContent = 'إرسال جميع المنتجات';
  }
});
</script>
</body>
</html>
